<h2>③ MVP 단계</h2>
<p class="subtitle">"투표로 진행" 선택 시 vs "직접 지정" 선택 시</p>

<div class="split">
  <div class="mockup">
    <div class="mockup-header">투표로 진행 선택 시</div>
    <div class="mockup-body" style="font-size:13px">
      <div style="display:flex;gap:4px;margin-bottom:14px">
        <div style="flex:1;background:#d1fae5;color:#065f46;text-align:center;padding:5px;border-radius:6px;font-size:11px">① ✓</div>
        <div style="flex:1;background:#d1fae5;color:#065f46;text-align:center;padding:5px;border-radius:6px;font-size:11px">② ✓</div>
        <div style="flex:1;background:#3b82f6;color:white;text-align:center;padding:5px;border-radius:6px;font-size:11px;font-weight:600">③ MVP</div>
      </div>

      <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px">
        <div style="padding:14px;border:2px solid #3b82f6;border-radius:10px;background:#eff6ff;cursor:pointer">
          <div style="font-weight:600;margin-bottom:4px">🗳️ 투표로 진행</div>
          <div style="font-size:12px;color:#3b82f6">경기 완료 후 참석자들이 직접 투표</div>
        </div>
        <div style="padding:14px;border:1px solid #e2e8f0;border-radius:10px;background:white;cursor:pointer">
          <div style="font-weight:600;margin-bottom:4px">👑 직접 지정</div>
          <div style="font-size:12px;color:#94a3b8">운영진이 MVP를 바로 지정</div>
        </div>
      </div>

      <div style="border-top:1px solid #f1f5f9;padding-top:10px;display:flex;gap:8px">
        <button class="mock-button" style="font-size:12px;background:#f1f5f9;color:#64748b;flex:1">← 이전</button>
        <button class="mock-button" style="font-size:12px;flex:2">등록 완료</button>
      </div>
    </div>
  </div>

  <div class="mockup">
    <div class="mockup-header">직접 지정 선택 시</div>
    <div class="mockup-body" style="font-size:13px">
      <div style="display:flex;gap:4px;margin-bottom:14px">
        <div style="flex:1;background:#d1fae5;color:#065f46;text-align:center;padding:5px;border-radius:6px;font-size:11px">① ✓</div>
        <div style="flex:1;background:#d1fae5;color:#065f46;text-align:center;padding:5px;border-radius:6px;font-size:11px">② ✓</div>
        <div style="flex:1;background:#3b82f6;color:white;text-align:center;padding:5px;border-radius:6px;font-size:11px;font-weight:600">③ MVP</div>
      </div>

      <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:14px">
        <div style="padding:14px;border:1px solid #e2e8f0;border-radius:10px;background:white;cursor:pointer">
          <div style="font-weight:600;margin-bottom:4px">🗳️ 투표로 진행</div>
          <div style="font-size:12px;color:#94a3b8">경기 완료 후 참석자들이 직접 투표</div>
        </div>
        <div style="padding:14px;border:2px solid #3b82f6;border-radius:10px;background:#eff6ff;cursor:pointer">
          <div style="font-weight:600;margin-bottom:4px">👑 직접 지정</div>
          <div style="font-size:12px;color:#3b82f6">운영진이 MVP를 바로 지정</div>
        </div>
      </div>

      <!-- 직접 지정 시 참석자 목록에서 선택 -->
      <div style="border:1px solid #e2e8f0;border-radius:8px;padding:10px;margin-bottom:14px">
        <div style="font-size:12px;color:#64748b;margin-bottom:8px">참석자 중 MVP 선택</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
          <div style="padding:8px;border:2px solid #f59e0b;border-radius:8px;background:#fffbeb;text-align:center;font-size:12px;font-weight:600">👑 홍길동</div>
          <div style="padding:8px;border:1px solid #e2e8f0;border-radius:8px;text-align:center;font-size:12px;color:#374151">김철수</div>
          <div style="padding:8px;border:1px solid #e2e8f0;border-radius:8px;text-align:center;font-size:12px;color:#374151">이영희</div>
          <div style="padding:8px;border:1px solid #e2e8f0;border-radius:8px;text-align:center;font-size:12px;color:#374151">박민수</div>
        </div>
      </div>

      <div style="border-top:1px solid #f1f5f9;padding-top:10px;display:flex;gap:8px">
        <button class="mock-button" style="font-size:12px;background:#f1f5f9;color:#64748b;flex:1">← 이전</button>
        <button class="mock-button" style="font-size:12px;flex:2">등록 완료</button>
      </div>
    </div>
  </div>
</div>
